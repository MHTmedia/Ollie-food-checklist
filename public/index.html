<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ollie Food Tracker</title>
  <meta name="description" content="Track Oliver's first foods: allergen introductions and 10–15 tries for every new flavor." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#182027" media="(prefers-color-scheme: dark)" />
  <!-- Home-screen app: icon, name, full-screen launch -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ollie Food Tracker" />
  <meta name="application-name" content="Ollie Food Tracker" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1 id="title">Ollie Food Tracker</h1>
        <p class="sub" id="age-line">Loading…</p>
      </div>
      <div class="topbar-actions">
        <span class="streak" id="streak" aria-live="polite">🔥 0</span>
        <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">⚙️</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="home" class="active">Home</button>
      <button role="tab" data-tab="foods">Foods</button>
      <button role="tab" data-tab="allergens">Allergens</button>
      <button role="tab" data-tab="history">History</button>
      <button role="tab" data-tab="guide">Guide</button>
    </nav>
  </header>

  <main id="view" class="container" aria-live="polite"></main>

  <!-- Bottom sheet / modal -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <button class="sheet-close icon-btn" id="sheet-close" aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
