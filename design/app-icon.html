<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:transparent}svg{display:block}</style></head><body>
<!-- App icon: teal tile, cream bowl with a smiling face, carrot + spoon peeking out, sprout on top. Full-bleed so iOS/Android can round it. -->
<svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1aa0c9"/><stop offset="1" stop-color="#0b6f92"/></linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="70%"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e6cf"/></linearGradient>
    <linearGradient id="carrot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffab45"/><stop offset="1" stop-color="#f07a12"/></linearGradient>
    <linearGradient id="food" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd25e"/><stop offset="1" stop-color="#f5a623"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#053a4e" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- confetti dots -->
  <circle cx="190" cy="230" r="22" fill="#ffd25e" opacity=".9"/><circle cx="850" cy="250" r="16" fill="#9fe08a" opacity=".9"/>
  <circle cx="840" cy="420" r="12" fill="#ffb3c1" opacity=".9"/><circle cx="170" cy="470" r="14" fill="#9fe08a" opacity=".8"/>
  <g id="art" transform="translate(512 520) scale(1.16) translate(-512 -545)"><g filter="url(#soft)">
    <!-- spoon -->
    <g transform="rotate(28 690 360)">
      <rect x="672" y="230" width="38" height="300" rx="19" fill="#f4f7f9"/>
      <ellipse cx="691" cy="215" rx="62" ry="82" fill="#f4f7f9"/>
      <ellipse cx="691" cy="215" rx="44" ry="62" fill="#e3e9ee"/>
    </g>
    <!-- carrot -->
    <g transform="rotate(-24 360 380)">
      <path d="M330 470 C318 400 330 300 360 250 C390 300 402 400 390 470 Z" fill="url(#carrot)"/>
      <path d="M340 330h22M344 380h24M346 430h20" stroke="#d96a0a" stroke-width="10" stroke-linecap="round"/>
      <path d="M360 254c-30-60-60-70-90-66 20 26 50 46 90 66zM360 254c0-66 16-96 40-112 6 40-10 80-40 112zM360 254c34-50 70-60 104-50-26 26-60 44-104 50z" fill="#56b34a"/>
    </g>
    <!-- food mound -->
    <path d="M250 560c40-90 160-130 262-130s222 40 262 130z" fill="url(#food)"/>
    <circle cx="420" cy="500" r="20" fill="#ffe89a"/><circle cx="600" cy="490" r="14" fill="#ffe89a"/>
    <!-- bowl -->
    <path d="M200 545h624c0 190-140 300-312 300S200 735 200 545z" fill="url(#bowl)"/>
    <rect x="186" y="530" width="652" height="44" rx="22" fill="#ffffff"/>
    <!-- face -->
    <circle cx="420" cy="665" r="20" fill="#3a3a3a"/><circle cx="604" cy="665" r="20" fill="#3a3a3a"/>
    <circle cx="427" cy="658" r="6" fill="#fff"/><circle cx="611" cy="658" r="6" fill="#fff"/>
    <path d="M462 715c26 28 74 28 100 0" stroke="#3a3a3a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="370" cy="715" r="26" fill="#ffb3c1" opacity=".75"/><circle cx="654" cy="715" r="26" fill="#ffb3c1" opacity=".75"/>
  </g></g>
</svg>
</body></html>
